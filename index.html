<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="format-detection" content="telephone=no">
<title>Teen Taali</title>
<meta name="description" content="A short floor game. Swap tiles to make three in a row and walk each shopper through the five ushering steps, in order.">
<link rel="icon" href="data:,">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<!-- fonts load without blocking: if Google Fonts hangs, the game still starts with system fonts -->
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Figtree:wght@500;600;700&family=Poppins:wght@500;600;700&display=swap" media="print" onload="this.media='all'">
<noscript><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Figtree:wght@500;600;700&family=Poppins:wght@500;600;700&display=swap"></noscript>
<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:100%;height:100%;overflow:hidden;background:#5B4BDB;overscroll-behavior:none;touch-action:none;
  -webkit-user-select:none;user-select:none;-webkit-touch-callout:none;-webkit-tap-highlight-color:transparent;-webkit-text-size-adjust:100%;text-size-adjust:100%}
body{font-family:Figtree,Poppins,system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;color:#0F0A6C}
#app{position:fixed;left:0;top:0;right:0;bottom:0;overflow:hidden;
  background:radial-gradient(120% 70% at 50% 0%,#6F60EA 0%,#5B4BDB 48%,#4A3CC8 100%)}
#app:before,#app:after{content:"";position:absolute;border-radius:50%;background:#fff;opacity:.05;pointer-events:none}
#app:before{width:46vmax;height:46vmax;left:-14vmax;bottom:-18vmax}
#app:after{width:30vmax;height:30vmax;right:-10vmax;top:-8vmax}
#game{position:absolute;left:0;top:0;width:320px;height:400px;overflow:hidden;transform-origin:0 0;background:#EEEBFF;
  font-family:Poppins,Figtree,system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;color:#0F0A6C}
#game.boxed{border-radius:16px;box-shadow:0 18px 50px rgba(15,10,60,.45)}
#game:focus{outline:none}  /* focus only waits here for a moment, between controls; it is not a control, so no ring */
#game svg{display:block;overflow:visible}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;-webkit-appearance:none;appearance:none;touch-action:none;
  -webkit-tap-highlight-color:transparent;text-align:center}
button:focus{outline:none}
button:focus-visible{outline:3px solid #0F0A6C;outline-offset:2px;box-shadow:0 0 0 6px #fff}
button[disabled]{cursor:default}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.ti .c1{fill:#5B4BDB}.ti .c2{fill:#C9C1FF}.ti .c3{fill:#3A2FA8}.ti .c4{fill:#FFB547}.ti .s1{stroke:#5B4BDB}.ti .s3{stroke:#3A2FA8}.ti .s4{stroke:#FFB547}

/* ---------- canopy (Archie's awning) ---------- */
.can{position:absolute;left:0;top:0;width:320px;height:38px;z-index:20;background:linear-gradient(#D6CDFF,#A592FF);transform-origin:50% 0}
.can .shine{position:absolute;left:52px;top:4px;width:44px;height:4px;border-radius:2px;background:#fff;opacity:.45}
.aeyes{position:absolute;left:8px;top:9px;width:40px;height:20px}
.ae{position:absolute;top:0;width:16px;height:18px;border-radius:50%;background:#fff;overflow:hidden;box-shadow:0 0 0 2px rgba(255,255,255,.45),0 0 8px 2px rgba(255,255,255,.55)}
.ae.a{left:2px}.ae.b{left:22px}
.ae .pp{position:absolute;left:4.5px;top:5px;width:7px;height:8px;border-radius:50%;background:#1B1748}
.ae .ld{position:absolute;left:-2px;top:-20px;width:20px;height:20px;background:#B7A8FF;border-bottom:2px solid #3A2FA8}
.ttl{position:absolute;left:97px;top:0;height:38px;display:flex;align-items:center;font:700 13.5px/1 Poppins,Figtree,Arial,sans-serif;color:#2E2590;letter-spacing:-.015em;white-space:nowrap}
.stat{position:absolute;top:8px;height:22px;display:flex;align-items:center;gap:4px;padding:0 7px 0 6px;border-radius:11px;background:rgba(255,255,255,.58);
  box-shadow:inset 0 0 0 1.5px #8F7BFA;font:700 12.5px/1 Figtree,Poppins,Arial,sans-serif;color:#2E2590;font-variant-numeric:tabular-nums;white-space:nowrap;transform-origin:50% 50%}
.stat svg{width:13px;height:13px;flex:none}
#sCnt{left:175px}#sTime{left:217px;min-width:56px}
.stat.low{background:#FFF1CC;box-shadow:inset 0 0 0 1.5px #E9A93A;color:#7A4A00}
.stat.low svg circle,.stat.low svg path{stroke:#B26B00}
.scal{position:absolute;left:0;top:37px;width:320px;height:10px;z-index:20;pointer-events:none}
.cbtn{position:absolute;top:0;width:54px;height:54px;z-index:22;display:flex;align-items:flex-start;justify-content:center;padding-top:5px}
.cbtn .chip{width:28px;height:28px;border-radius:50%;background:rgba(255,255,255,.62);box-shadow:inset 0 0 0 1.5px #8F7BFA;display:flex;align-items:center;justify-content:center;color:#2E2590}
.cbtn .chip svg{width:18px;height:18px}
.cbtn:focus-visible{outline:none;box-shadow:none}
.cbtn:focus-visible .chip{outline:3px solid #0F0A6C;outline-offset:1px}
.cbtn.off .chip{opacity:.35}
/* ?close=1: the X gets its own 54 px slot; the title makes way */
#game.withclose .ttl{display:none}
#game.withclose #sCnt{left:98px}
#game.withclose #sTime{left:140px}

/* ---------- walk-in strip ---------- */
.strip{position:absolute;left:0;top:38px;width:320px;height:76px;overflow:hidden;z-index:2;
  background:radial-gradient(70% 150% at 9% 40%,rgba(255,210,130,.62) 0,rgba(255,226,170,.26) 46%,rgba(238,235,255,0) 78%),#EEEBFF}
.strip .flr{position:absolute;left:0;top:69px;width:320px;height:7px;background:linear-gradient(#E3DDFF,#D7CFFF)}
.dw{position:absolute;left:6px;top:7px;width:50px;height:66px;border-radius:25px 25px 0 0;background:#fff;box-shadow:inset 0 0 0 3px #CFC7FB;overflow:hidden}
.dw .dg{position:absolute;left:6px;top:6px;right:6px;bottom:0;border-radius:19px 19px 0 0;background:linear-gradient(180deg,#FFE3A6,#FFF6DF)}
.dw .dl{position:absolute;left:-30%;top:0;width:60%;height:100%;background:linear-gradient(90deg,rgba(255,255,255,0),rgba(255,255,255,.7),rgba(255,255,255,0));transform:skewX(-14deg)}
.chw{position:absolute;left:0;top:0;transform-origin:0 0}
.chw svg{width:100%;height:100%}
.rbw{position:absolute;left:0;top:0;width:41px;height:60px}
.rbw svg{width:41px;height:60px}
.sec{position:absolute;left:0;top:8px;width:80px;height:61px;border-radius:11px;background:#fff;box-shadow:inset 0 0 0 2px #DDD7FF,0 3px 0 #D3CCFB}
.sec span{position:absolute;left:0;right:0;top:4px;text-align:center;font:700 12px/14px Figtree,Poppins,Arial,sans-serif;color:#3A2FA8;white-space:nowrap}
.sec .sic{position:absolute;left:21px;top:19px;width:38px;height:38px}
.sec .sic svg{width:38px;height:38px}
.sec .bz{position:absolute;left:0;top:18px;width:80px;height:43px}
.sec .bz .mt{position:absolute;left:8px;bottom:0;width:30px;height:36px}
.sec .bz .mt svg{width:30px;height:36px}
.sec .bz .cu{position:absolute;left:46px;bottom:0;width:26px;height:33px}
.sec .bz .cu svg{width:26px;height:33px}
.sec .bz .bt{position:absolute;left:27px;top:3px;width:26px;height:15px;border-radius:8px;background:#EEEBFF;box-shadow:0 0 0 1.5px #C9C1FF;display:flex;align-items:center;justify-content:center;gap:2.5px}
.sec .bz .bt i{width:3.5px;height:3.5px;border-radius:50%;background:#5B4BDB}
.dst{position:absolute;left:0;top:0;pointer-events:none}
.dph{width:9px;height:13px}
.dph .ph{position:absolute;left:0;top:0;width:9px;height:13px;border-radius:2.5px;background:#2B2E44;box-shadow:0 0 0 1.3px #fff,0 0 7px 3px rgba(95,227,255,.9)}
.dph .ph:after{content:"";position:absolute;left:1.6px;top:1.6px;width:5.8px;height:8px;border-radius:1.2px;background:#7FE9FF}
.dph .bzl{position:absolute;left:-7px;top:-4px;width:25px;height:16px}
.dmg{width:30px;height:26px}
.dmg svg{width:30px;height:26px}
.dir{width:30px;height:28px}
.dir svg{width:30px;height:28px}
.mb{position:absolute;left:0;top:7px;width:34px;height:27px;border-radius:10px;background:#fff;box-shadow:0 2px 0 #DDD7FF,0 0 0 1.5px #E2DDFF;transform-origin:20% 100%}
.mb:after{content:"";position:absolute;left:6px;bottom:-4px;width:9px;height:9px;background:#fff;transform:rotate(45deg);border-radius:2px;box-shadow:2px 2px 0 #DDD7FF}
.mb svg{position:relative;z-index:1;width:24px;height:24px;margin:1.5px auto 0}
.chain{position:absolute;left:0;top:0;width:320px;height:76px;transform-origin:150px 32px}
.rail{position:absolute;top:30px;height:4px;border-radius:2px;background:#DDD7FF}
.rail.on{background:#41E7AB;transform-origin:0 50%}
.st{position:absolute;top:20px;width:24px;height:24px;margin-left:-12px;border-radius:50%;display:flex;align-items:center;justify-content:center;transform-origin:50% 50%}
.st svg.g{width:15px;height:15px}
.st.todo{background:#fff;box-shadow:inset 0 0 0 2px #DDD7FF}
.st.next{box-shadow:0 0 0 3px #fff,0 0 0 6px rgba(255,181,71,.45),0 0 14px 6px rgba(255,181,71,.55)}
.st.next svg.g{width:17px;height:17px}
.st .tb{position:absolute;right:-5px;top:-5px;width:14px;height:14px;border-radius:50%;background:#0F0A6C;box-shadow:0 0 0 1.5px #fff;display:none;align-items:center;justify-content:center}
.st .tb svg{width:9px;height:9px}
.st.done .tb{display:flex}
.nx{position:absolute;left:0;top:49px;height:17px;padding:0 8px;border-radius:9px;background:#3A2FA8;color:#fff;font:700 12px/17px Figtree,Poppins,Arial,sans-serif;white-space:nowrap;transform-origin:50% 0}
.hov{position:absolute;left:8px;top:10px;width:120px;height:44px;transform-origin:0 50%}
.hov b{display:inline-flex;align-items:center;gap:4px;height:19px;padding:0 8px 0 6px;border-radius:10px;background:#41E7AB;color:#0F0A6C;font:700 12px/19px Figtree,Poppins,Arial,sans-serif;white-space:nowrap}
.hov b svg{width:11px;height:11px}
.hov .md{position:absolute;left:2px;top:28px;width:80px;height:12px}
.hov .md i{position:absolute;top:0;width:11px;height:11px;border-radius:50%;box-shadow:0 0 0 2px #fff}
.sbub{position:absolute;top:9px;max-width:200px;padding:5px 9px 6px;border-radius:12px;background:#fff;box-shadow:0 2px 0 rgba(27,23,72,.13),0 0 0 1.5px #E2DDFF;
  font:600 12.5px/1.2 Figtree,Poppins,system-ui,sans-serif;color:#1B1748;letter-spacing:-.005em;text-wrap:balance;z-index:6}
.sbub .tl{position:absolute;bottom:-5px;width:10px;height:10px;background:#fff;transform:rotate(45deg);border-radius:2px;box-shadow:1.5px 1.5px 0 #E2DDFF}
.rsb{transform-origin:100% 100%}
.rsb .tl{right:12px}
.lsb{display:flex;align-items:center;gap:5px;transform-origin:0 100%}
.lsb .tl{left:10px}
.lsb svg{width:26px;height:26px;flex:none}
.tsb{width:36px;height:30px;padding:0;display:flex;align-items:center;justify-content:center;transform-origin:100% 100%}
.tsb .tl{right:8px}
.tsb svg.x{position:absolute;left:4px;top:1px;width:28px;height:28px}
.tsb .tg{width:20px;height:20px}
.tsb .tg svg{width:20px;height:20px}

/* ---------- board ---------- */
.bd{position:absolute;left:17px;top:114px;width:286px;height:286px;z-index:3;border-radius:14px 14px 0 0;overflow:hidden;
  background:#DDD7FF;box-shadow:inset 0 2px 0 #CFC7FB}
.bdi{position:absolute;left:0;top:0;width:286px;height:286px}
.tl{position:absolute;left:0;top:0;width:43px;height:43px;border-radius:11px;background:#fff;box-shadow:0 2.5px 0 #C3BAF6;transform-origin:21.5px 21.5px;will-change:transform}
.tl i.ds{position:absolute;left:4px;top:4px;width:35px;height:35px;border-radius:50%;display:flex;align-items:center;justify-content:center;box-shadow:inset 0 -2.5px 0 rgba(15,10,108,.16)}
.tl i.ds svg{width:23px;height:23px}
.tl.trap{background:#FFF1EE;box-shadow:inset 0 0 0 2px #FF9C90,0 2.5px 0 #F3B5AC}
.tl.trap .tg{position:absolute;left:9.5px;top:9.5px;width:24px;height:24px}
.tl.trap .tg svg{width:24px;height:24px}
.tl.trap .ir{position:absolute;left:2px;top:3px;width:39px;height:36px}
.tl.trap .ir svg{width:39px;height:36px}
.tl .fl{position:absolute;left:0;top:0;width:43px;height:43px;border-radius:11px;background:#fff;opacity:0;pointer-events:none}
.tl .rg{position:absolute;left:-3px;top:-3px;width:49px;height:49px;border-radius:13px;box-shadow:0 0 0 3px #FFB547,0 0 12px 3px rgba(255,181,71,.65);opacity:0;pointer-events:none}
.bdim{position:absolute;left:0;top:0;width:286px;height:286px;background:rgba(238,235,255,.62);pointer-events:none;opacity:0;z-index:20}   /* above every tile (they go up to z 13) */
.cells{position:absolute;left:17px;top:114px;width:286px;height:286px;z-index:9;touch-action:none}
.cell{position:absolute;width:47px;height:47px;border-radius:12px;touch-action:none}
.cell:focus-visible{outline:3px solid #0F0A6C;outline-offset:-3px;box-shadow:inset 0 0 0 6px rgba(255,255,255,.85)}
.fxl{position:absolute;left:17px;top:114px;width:286px;height:286px;z-index:10;pointer-events:none}
.fx{position:absolute;left:0;top:0;pointer-events:none}
.fx.ring{width:40px;height:40px;margin:-20px 0 0 -20px;border-radius:50%;border:4px solid #FFB547}
.fx.dot{width:7px;height:7px;margin:-3.5px 0 0 -3.5px;border-radius:50%}
.fx.clap{width:44px;height:44px;margin:-22px 0 0 -22px}
.fx.clap svg{width:44px;height:44px;filter:drop-shadow(0 3px 3px rgba(15,10,108,.25))}
.fx.lbl{margin:0;white-space:nowrap;font:700 22px/1 Poppins,Figtree,Arial,sans-serif;color:#fff;-webkit-text-stroke:5px #5B4BDB;paint-order:stroke fill;letter-spacing:-.01em}
.fx.tag{margin:0;padding:2px 7px;border-radius:8px;background:#C9352B;color:#fff;font:700 12px/14px Poppins,Figtree,Arial,sans-serif;white-space:nowrap;letter-spacing:-.005em;box-shadow:0 0 0 1.5px #fff,0 2px 0 rgba(110,20,20,.28)}
.fx.gag{width:60px;height:56px;margin:-28px 0 0 -30px}
.fx.gag svg{width:60px;height:56px}
.fly{position:absolute;left:0;top:0;width:22px;height:22px;margin:-11px 0 0 -11px;border-radius:50%;z-index:24;pointer-events:none;display:flex;align-items:center;justify-content:center;box-shadow:0 0 0 2px #fff,0 0 10px 2px rgba(255,255,255,.8)}
.fly svg{width:14px;height:14px}
.ipop{position:absolute;left:0;top:0;width:110px;height:101px;margin:-50px 0 0 -55px;z-index:23;pointer-events:none;transform-origin:50% 60%}
.ipop svg{width:110px;height:101px}

/* ---------- glass doors (intro, help, end card) ---------- */
.door{position:absolute;top:38px;width:160px;height:362px;z-index:14;pointer-events:none;background:linear-gradient(100deg,rgba(232,244,255,.97),rgba(176,196,255,.93))}
.door.l{left:0;box-shadow:inset 0 0 0 3px rgba(255,255,255,.55),inset -3px 0 0 #8F7BFA}
.door.r{left:160px;box-shadow:inset 0 0 0 3px rgba(255,255,255,.55),inset 3px 0 0 #8F7BFA}
.door:before{content:"";position:absolute;left:28px;top:40px;width:16px;height:250px;background:#fff;opacity:.45;transform:skewX(-14deg)}
.door i{position:absolute;top:160px;width:6px;height:40px;border-radius:3px;background:#5B4BDB}
.door.l i{right:12px}.door.r i{left:12px}
.door span{display:none;position:absolute;top:118px;font:700 31px/1 Poppins,Figtree,Arial,sans-serif;color:#2E2590;letter-spacing:-.02em}
.door.l span{right:22px}.door.r span{left:22px}
.door.titled span{display:block}
.door.plain i{display:none}

/* ---------- end panel (sits on Archie's closed glass doors) ---------- */
.endp{position:absolute;left:0;top:38px;width:320px;height:362px;z-index:16;pointer-events:none}
.endp .said{position:absolute;left:12px;right:12px;top:8px;min-height:44px;display:flex;align-items:center;gap:8px;padding:5px 12px 5px 6px;border-radius:14px;background:#fff;
  box-shadow:0 3px 0 rgba(27,23,72,.12),0 0 0 2px #C9C1FF;font:600 13px/1.22 Poppins,Figtree,Arial,sans-serif;color:#1B1748;letter-spacing:-.01em;text-wrap:balance}
.endp .said .av{width:32px;height:32px;flex:none;border-radius:50%;background:#EEEBFF}
.endp .said .av svg{width:32px;height:32px}
.endp .pic{position:absolute;left:22px;top:62px;width:80px;height:80px;border-radius:14px;background:linear-gradient(#FFF8E8,#FFE9BD);box-shadow:inset 0 0 0 3px #FFB547,0 3px 0 #E59A2E;overflow:hidden}
.endp .pic .fig{position:absolute;bottom:0}
.endp .pic .fig svg{width:100%;height:100%}
.endp .pbadge{position:absolute;left:80px;top:118px;width:34px;height:34px;border-radius:50%;display:flex;align-items:center;justify-content:center;box-shadow:0 0 0 3px #fff}
.endp .pbadge svg{width:21px;height:21px}
.endp .scorew{position:absolute;left:130px;top:62px;width:180px}
.endp .scr{font:700 46px/1 Poppins,Figtree,Arial,sans-serif;color:#0F0A6C;letter-spacing:-.03em}
.endp .scr small{font-size:26px;letter-spacing:0}
.endp .stars{display:flex;gap:5px;margin-top:6px}
.endp .stars svg{width:24px;height:24px}
.endp .best{margin-top:6px;font:600 12.5px/1.2 Figtree,Poppins,Arial,sans-serif;color:#3A2FA8}
.endp .stats{position:absolute;left:8px;right:8px;top:160px;height:24px;display:flex;justify-content:center;gap:4px}
.endp .stats span{display:flex;align-items:center;gap:3px;height:24px;padding:0 7px 0 5px;border-radius:12px;background:rgba(255,255,255,.78);box-shadow:inset 0 0 0 1.5px #C9C1FF;
  font:600 12px/1 Poppins,Figtree,Arial,sans-serif;color:#2E2590;white-space:nowrap}
.endp .stats svg{width:13px;height:13px;flex:none}
.endp .rem{position:absolute;left:12px;right:12px;top:194px;min-height:62px;border-radius:14px;background:#fff;box-shadow:0 3px 0 #D9D3FF,inset 0 0 0 2px #E2DDFF;padding:7px 12px 8px}
.endp .rem small{display:block;font:700 10px/1 Figtree,Poppins,Arial,sans-serif;letter-spacing:.09em;text-transform:uppercase;color:#4A3CC8}
.endp .rem p{font:600 13.5px/1.22 Poppins,Figtree,Arial,sans-serif;color:#0F0A6C;margin-top:5px;letter-spacing:-.01em;text-wrap:balance}
.dt{display:inline-block;margin-right:5px;padding:2px 5px 1px;border:2px solid #C21F3A;border-radius:5px;font:700 12px/1.1 Poppins,Figtree,Arial,sans-serif;color:#C21F3A;letter-spacing:.03em;transform:rotate(-4deg);vertical-align:1px;background:#fff}
.toast .dt{border-color:#FF8A7E;color:#FFC4BD;background:transparent}
.abw{position:absolute;left:160px;top:120px;width:0;height:0;z-index:18;pointer-events:none}
.ab{position:absolute;left:0;top:0;display:flex;align-items:center;gap:6px;background:#fff;border-radius:14px;padding:4px 12px 4px 4px;
  box-shadow:0 3px 0 rgba(27,23,72,.16),0 0 0 2px #C9C1FF;font:600 13.5px/1.15 Poppins,Figtree,Arial,sans-serif;color:#1B1748;white-space:nowrap;letter-spacing:-.01em;transform-origin:50% 0}
.ab .av{width:28px;height:28px;flex:none;border-radius:50%;background:#EEEBFF}
.ab .av svg{width:28px;height:28px}

/* ---------- toast, captions, buttons ---------- */
.toast{position:absolute;left:0;top:296px;width:320px;height:104px;z-index:19;background:#3A2FA8;border-radius:18px 18px 0 0;box-shadow:0 -6px 16px rgba(58,47,168,.25);color:#fff}
.toast .arc{position:absolute;left:10px;top:28px;width:48px;height:48px;border-radius:13px;background:rgba(255,255,255,.12);display:flex;align-items:center;justify-content:center}
.toast .arc svg{width:42px;height:43px}
.toast p{position:absolute;left:68px;right:56px;top:0;height:96px;display:flex;align-items:center;font:600 14.5px/1.3 Poppins,Figtree,Arial,sans-serif;letter-spacing:-.005em;text-wrap:balance}
.toast p.long{font-size:13.5px;line-height:1.26}
.toast .go{position:absolute;right:2px;top:25px;width:54px;height:54px;display:flex;align-items:center;justify-content:center}
.toast .go span{width:40px;height:40px;border-radius:50%;background:#fff;display:flex;align-items:center;justify-content:center}
.toast .go svg{width:20px;height:20px}
.toast .go:focus-visible{outline:none;box-shadow:none}
.toast .go:focus-visible span{outline:3px solid #41E7AB;outline-offset:2px}
.toast .bar{position:absolute;left:68px;right:56px;bottom:9px;height:3px;border-radius:2px;background:rgba(255,255,255,.16);overflow:hidden}
.toast .bar i{display:block;width:100%;height:100%;background:#41E7AB;transform-origin:0 50%}
.dcapw{position:absolute;left:160px;top:364px;width:0;height:0;z-index:21}
.dcap{position:absolute;left:0;top:0;height:26px;display:flex;align-items:center;gap:8px;padding:0 13px 0 10px;border-radius:13px;background:#0F0A6C;color:#fff;
  font:600 13px/1 Poppins,Figtree,Arial,sans-serif;white-space:nowrap;box-shadow:0 0 0 2px #fff,0 4px 10px rgba(15,10,108,.3);letter-spacing:-.005em;transform-origin:50% 0}
.dcap .st2{display:flex;gap:3px}
.dcap .st2 i{width:6px;height:6px;border-radius:50%;background:rgba(255,255,255,.3)}
.dcap .st2 i.on{background:#41E7AB}
.big{position:absolute;left:16px;top:318px;width:288px;height:66px;border-radius:20px;z-index:22;color:#fff;font:700 23px/1 Poppins,Figtree,Arial,sans-serif;letter-spacing:-.01em;
  background:linear-gradient(#7E70F4,#5B4BDB 58%,#4A3CC8);box-shadow:0 6px 0 #2F2690,inset 0 2px 0 rgba(255,255,255,.35);display:flex;align-items:center;justify-content:center;gap:12px;transform-origin:50% 50%}
.big svg{width:22px;height:22px}
.endb{position:absolute;left:16px;top:318px;width:288px;height:66px;z-index:22;display:flex;gap:8px;transform-origin:50% 50%}
.endb button{height:66px;border-radius:18px;font:700 16.5px/1.05 Poppins,Figtree,Arial,sans-serif;letter-spacing:-.01em;display:flex;align-items:center;justify-content:center;gap:8px}
.endb .pri{flex:1.65;color:#fff;background:linear-gradient(#7E70F4,#5B4BDB 58%,#4A3CC8);box-shadow:0 5px 0 #2F2690,inset 0 2px 0 rgba(255,255,255,.35)}
.endb .sec2{flex:1;color:#3E33B0;background:#fff;box-shadow:0 4px 0 #C9C1FF,inset 0 0 0 2.5px #C9C1FF}
.endb .pri svg{width:18px;height:18px}
.endb.fail .pri{display:none}
.endb button[disabled]{pointer-events:none}  /* while they pop in, taps pass through (and still count as part of a run of taps) */
.endb.fail .sec2{flex:1;color:#fff;background:linear-gradient(#7E70F4,#5B4BDB 58%,#4A3CC8);box-shadow:0 5px 0 #2F2690,inset 0 2px 0 rgba(255,255,255,.35)}
.hand{position:absolute;left:0;top:0;width:54px;height:68px;z-index:30;pointer-events:none;transform-origin:21px 2px}
.hand svg{width:54px;height:68px;filter:drop-shadow(0 6px 6px rgba(15,10,108,.25))}

document.addEventListener('keydown', function (e) {
  var k = e.key;
  if (k === 'Escape' || k === 'Esc') { e.preventDefault(); deselect(); return; }        /* mandatory: Esc only puts a tile down, never exits */
  if (k === 'Backspace' && e.target === document.body) { e.preventDefault(); return; }
  if (k === 'Tab') { G.lastInput = 'key'; return; }
  var ci = cellIndex(document.activeElement);
  if (DIRS[k]) {
    G.lastInput = 'key'; e.preventDefault();
    if (ci < 0) { if (G.mode === 'round' && G.phase !== 'end') focusCell(G.kfocus); return; }
    var d = DIRS[k], r = rowOf(ci) + d[0], c = colOf(ci) + d[1];
    if (r < 0 || r >= N || c < 0 || c >= N) return;
    var j = r * N + c;
    if (G.sel === ci && canAct()) { if (trySwap(ci, j)) focusCell(j); return; }         /* a picked-up tile: the arrow swaps it */
    focusCell(j);
    return;
  }
  if (k === ' ' || k === 'Spacebar' || k === 'Enter') {
    G.lastInput = 'key'; firstGesture();                                                 /* keyboard players get the Back guard too */
    if (TO.on && G.mode === 'round') { e.preventDefault(); if (!e.repeat) skipToast(); return; }   /* Enter or Space moves the deck line on */
    if (e.repeat) { e.preventDefault(); return; }
    if (ci >= 0) { e.preventDefault(); tapCell(ci); return; }
    var tg = document.activeElement;
    if (tg && tg.tagName === 'BUTTON' && !tg.disabled) return;                           /* let the focused button click */
    if (G.phase === 'demoEnd' && !D.yt.disabled) { e.preventDefault(); yourTurn(); return; }   /* Enter starts the round even if focus is elsewhere */
    e.preventDefault();
    if (G.mode === 'round' && G.phase !== 'end') focusCell(G.kfocus);
  }
});
document.addEventListener('contextmenu', function (e) { e.preventDefault(); });
document.addEventListener('selectstart', function (e) { e.preventDefault(); });
document.addEventListener('dragstart', function (e) { e.preventDefault(); });
document.addEventListener('dblclick', function (e) { e.preventDefault(); });
document.addEventListener('touchmove', function (e) { e.preventDefault(); }, { passive: false });
document.addEventListener('gesturestart', function (e) { e.preventDefault(); });
document.addEventListener('visibilitychange', function () { hiddenPause = !!document.hidden; if (!hiddenPause) lastTs = 0; });

/* =====================================================================
   TEST HOOKS  (TT_DEBUG)
   ===================================================================== */
function rectOf(el) { if (!el) return null; var r = el.getBoundingClientRect(); return { x: r.left + r.width / 2, y: r.top + r.height / 2, w: r.width, h: r.height }; }
function visibleText(el) { if (!el) return false; for (var p = el; p && p !== document.body; p = p.parentElement) { var cs = getComputedStyle(p); if (cs.display === 'none' || cs.visibility === 'hidden' || +cs.opacity < .05) return false; } return true; }
function wordsOnScreen() {
  var list = [];
  function add(el) { if (el && visibleText(el)) { var s = (el.textContent || '').trim(); if (s) list.push(s); } }
  [D.toastTx, D.abTx, D.dcapTx, D.rsbTx, D.lsbTx, D.nx, D.secTx, q('.hov b span'), q('.ttl'), D.sCntN, D.sTimeN, D.yt, D.eSaid, D.eBest, D.eStats, D.eRemTx, D.again, D.enter].forEach(add);
  qa('.fx.lbl').forEach(add); qa('.fx.tag').forEach(add);
  if (DOOR.o < .5 && D.doorL.classList.contains('titled')) list.push(CONTENT.title.join(' '));
  return { count: list.reduce(function (n, s) { return n + words(s); }, 0), items: list, bang: list.some(function (s) { return s.indexOf('!') >= 0; }) };
}
function boardRows() { var out = []; for (var r = 0; r < N; r++) { var s = ''; for (var c = 0; c < N; c++) { var t = grid[r * N + c]; s += t ? t.k : '.'; } out.push(s); } return out; }
window.TT_DEBUG = {
  state: function () {
    var onBoard = []; grid.forEach(function (t, i) { if (t && isTrap(t.k)) onBoard.push({ k: t.k, r: rowOf(i), c: colOf(i) }); });
    return { mode: G.mode, phase: G.phase, busy: G.busy, board: boardRows(), step: G.step, next: G.ready && G.step < 5 ? STEP_K[G.step] : null, nextName: G.ready && G.step < 5 ? STEP_NAME[STEP_K[G.step]] : null,
      handed: G.handed, shopper: G.cur ? { who: G.cur.who, mission: G.cur.mission, busy: G.cur.busy, idx: G.qi } : null, queue: G.queue.map(function (x) { return x.who + ':' + x.mission + (x.busy ? ':busy' : ''); }),
      traps: { spawned: T.spawned, cleared: T.cleared, onBoard: onBoard, list: T.list, first: T.first, nextT: T.nextT, order: T.order },
      timeLeft: G.timeLeft, playT: G.playT, timing: G.timing, timeUp: G.timeUp, toast: TO.on ? D.toastTx.textContent : null, toastAge: TO.on ? clock - TO.t0 : null, queued: G.toastQ.length,
      handPending: G.handPending, scene: G.scene, points: G.points, moves: G.moves, cascadeMax: G.cascadeMax, shuffles: G.shuffles || 0, sel: G.sel, round: G.roundN, final: G.final,
      demoSeen: G.demoSeen, helpOK: G.helpOK, ready: canAct(), clock: clock, starveT: G.starveT, bias: dropBias(), timeScale: tScale, opts: OPT, sound: soundOn,
      rohan: { x: RB.x, dir: RB.dir }, bubble: BUB.rsb.s > .5 ? D.rsbTx.textContent : null, words: wordsOnScreen() };
  },
  brief: function () { return { mode: G.mode, ready: canAct(), next: G.ready && G.step < 5 ? STEP_K[G.step] : null, toast: TO.on, toastAge: TO.on ? clock - TO.t0 : 0, clock: clock, final: G.final, round: G.roundN, shuffles: G.shuffles || 0, cascadeMax: G.cascadeMax, handed: G.handed, playT: G.playT }; },
  tick: function (fn) { G.botTick = typeof fn === 'function' ? fn : null; },
  speed: function (n) { if (n != null) tScale = Math.max(0, isNaN(+n) ? 1 : +n); return tScale; },
  swap: function (r1, c1, r2, c2) { G.lastInput = 'pointer'; return trySwap(+r1 * N + +c1, +r2 * N + +c2); },
  tap: function (r, c) { G.lastInput = 'pointer'; tapCell(+r * N + +c); return G.sel; },
  setBoard: function (rows) {
    var K = rows.join('').split('').map(function (k) { return k === '.' ? null : k; });
    buildBoard(K);
    grid.forEach(function (t) { if (t && isTrap(t.k) && t.tid < 0) { t.tid = T.list.length; T.list.push({ k: t.k, t0: G.playT, t1: -1 }); T.spawned++; } });
    return boardRows();
  },
  findMove: function (k) { var mv = findMoves(kinds()); if (k) mv = mv.filter(function (m) { return m.kinds.indexOf(k) >= 0; }); var m = mv[0]; return m ? { r1: rowOf(m.a), c1: colOf(m.a), r2: rowOf(m.b), c2: colOf(m.b), kinds: m.kinds, size: m.size } : null; },
  moves: function () { return findMoves(kinds()).map(function (m) { return { r1: rowOf(m.a), c1: colOf(m.a), r2: rowOf(m.b), c2: colOf(m.b), kinds: m.kinds, size: m.size }; }); },
  spawnTrap: function (k, r, c) {
    var i = +r * N + +c, old = grid[i]; if (old) killTile(old);
    var t = makeTile(k, +r, +c); grid[i] = t; t.tid = T.list.length; T.list.push({ k: k, t0: G.playT, t1: -1 }); T.spawned++; trapTag(t, 0, 1.4); cellLabels(); return boardRows();
  },
  force: function (what, arg) {
    if (what === 'demo') { G.demoReturn = null; startDemo(false); }
    else if (what === 'round') startRound();
    else if (what === 'end') {
      if (arg) { if (arg.handed != null) G.handed = arg.handed; if (arg.traps) T.list = arg.traps; if (arg.seconds != null) G.playT = arg.seconds; if (arg.waits) G.waits = arg.waits; if (arg.who) G.lastWho = arg.who; }
      G.mode = 'round'; G.timeLeft = 0; endRound();
    }
    else if (what === 'reshuffle') { if (!G.busy) reshuffle(settle); }
    else if (what === 'handover') { G.step = 4; tickStep({ k: 'H', cells: [14, 15, 16] }); at(.2, flushQueue); }
    return this.state();
  },
  time: function (s) { G.timeLeft = +s; return G.timeLeft; },
  tune: function (o) { if (o) Object.keys(o).forEach(function (k) { TUNE[k] = o[k]; }); return TUNE; },
  skip: function () { if (TO.on) { TO.t0 = -99; TO.open0 = -99; skipToast(); } },
  tapToast: function () { G.lastInput = 'pointer'; skipToast(); },
  rect: function (name) {
    if (typeof name === 'object' && name) return rectOf(D.cell[name.r * N + name.c]);
    var m = /^cell:(\d),(\d)$/.exec(String(name)); if (m) return rectOf(D.cell[+m[1] * N + +m[2]]);
    var map = { toast: D.toast, next: D.tgo, yt: D.yt, enter: D.enter, again: D.again, snd: D.snd, hlp: D.hlp, cls: D.cls, game: game, strip: D.strip, chain: D.chain, board: D.cells, rohan: D.rbw, bubble: D.rsb };
    return rectOf(map[name]);
  },
  messages: G.sent,
  resetStorage: function () { try { localStorage.removeItem('teenTaali.demoSeen'); localStorage.removeItem('teenTaali.best'); } catch (e) {} },
  words: wordsOnScreen
};

/* =====================================================================
   BOOT
   ===================================================================== */
game.tabIndex = -1;
for (var gi0 = 0; gi0 < 36; gi0++) grid.push(null);
/* demo.html's focus loop: Tab past the last control (edge 'end') lands on the first one, Shift+Tab past the first (edge 'start') on the last */
window.addEventListener('message', function (e) {
  if (window.parent === window || e.source !== window.parent) return;
  var d = e.data; if (!d || typeof d !== 'object' || d.type !== 'teen-taali-focus') return;
  G.lastInput = 'key';
  var list = tabbables();
  if (!list.length) { parkFocus(); return; }
  try { (d.edge === 'start' ? list[list.length - 1] : list[0]).focus(); } catch (err) {}
});
layout();
setInterval(countUp, 50);
requestAnimationFrame(frame);
var showDemo = OPT.demo === 'always' || (OPT.demo !== 'never' && !G.demoSeen);
intro(showDemo);
})();
